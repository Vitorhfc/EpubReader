<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leitor de EPUB</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <section id="view-library">
    <div class="library-inner">
      <div class="brand"><span class="brand-mark">§</span><span class="brand-name">Leitor de EPUB</span></div>

      <div class="dropzone" id="dropzone" role="button" tabindex="0">
        <div class="dropzone-icon">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </div>
        <div class="dropzone-title">Solte um arquivo .epub aqui</div>
        <div class="dropzone-sub">ou clique para escolher no seu computador</div>
      </div>
      <p class="hint">Arquivos .epub sem proteção DRM. A cor da tela e o ponto de leitura ficam salvos neste navegador.</p>

      <div id="library-section" hidden>
        <div class="library-section-title">Continuar lendo</div>
        <div class="spine-row" id="library-list"></div>
      </div>
    </div>
    <input type="file" id="file-input" accept=".epub,application/epub+zip" hidden>
  </section>

  <section id="view-reader" hidden>
    <div class="topbar">
      <button class="icon-btn" id="back-to-library" aria-label="Voltar à biblioteca">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="reader-title" id="reader-title"></div>
      <button class="icon-btn" id="open-toc" aria-label="Sumário">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>
      </button>
      <button class="icon-btn" id="open-settings" aria-label="Aparência" style="font-family:var(--serif);font-size:15px;">Aa</button>
    </div>

    <div class="viewport-wrap">
      <div id="book-host"></div>
      <div class="tap-chevron left"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 18l-6-6 6-6"/></svg></div>
      <div class="tap-chevron right"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 6l6 6-6 6"/></svg></div>
    </div>

    <div class="statusbar">
      <div class="status-row"><span id="status-chapter"></span><span id="status-page"></span></div>
      <div class="progress-track"><span id="status-progress-fill" style="width:0%"></span></div>
    </div>
  </section>

  <div class="panel-backdrop" id="backdrop"></div>

  <aside class="panel" id="panel-settings">
    <h3>Aparência</h3>
    <div class="theme-row">
      <button class="theme-swatch paper" data-theme="paper">Papel</button>
      <button class="theme-swatch sepia" data-theme="sepia">Sépia</button>
      <button class="theme-swatch night" data-theme="night">Noite</button>
    </div>
    <div class="field-row">
      <span class="field-label">Tamanho do texto</span>
      <div class="stepper">
        <button id="font-dec" aria-label="Diminuir fonte">A−</button>
        <span id="font-size-label">100%</span>
        <button id="font-inc" aria-label="Aumentar fonte">A+</button>
      </div>
    </div>
    <div class="field-row" style="flex-direction:column;align-items:stretch;gap:8px;">
      <span class="field-label">Fonte</span>
      <div class="font-toggle">
        <button data-font="serif">Serifada</button>
        <button data-font="sans">Sem serifa</button>
      </div>
    </div>
  </aside>

  <aside class="panel" id="panel-toc">
    <h3>Sumário</h3>
    <div id="toc-list"></div>
  </aside>

  <div id="toast"></div>
  <div id="loading-overlay" hidden><div class="spinner"></div><span style="font-size:13px;color:var(--paper-dim)">Abrindo livro…</span></div>
</div>

<script src="script.js"></script>
</body>
</html>
